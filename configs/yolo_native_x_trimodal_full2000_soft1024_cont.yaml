# YOLO11x full2000 soft 1024 CONTINUATION (stage2 of X direction B).
#
# stage1 (full2000_soft768_adapt, 36ep, cold-start from COCO yolo11x.pt) reached
# local 200-val mAP50-95=0.484. This stage ups resolution to 1024 (small-object
# advantage proven by m's 56.727 line) and continues WITHOUT early stopping at a
# low LR, mirroring m's full2000_soft1024_cont_noearly recipe that produced the
# 1024 conf0.65=56.727 best.
#
# Start from stage1 best.pt (soft-domain adapted). No early stop (patience=0).
# Data: data/yolo_full2000_soft (1800 train / 200 val, soft-fused, labels refreshed).
#
# Run: yolo detect train cfg=configs/yolo_native_x_trimodal_full2000_soft1024_cont.yaml

model: runs/detect/runs/native_x_trimodal/full2000_soft768_adapt/weights/best.pt
data: data/yolo_full2000_soft/data.yaml
epochs: 40
imgsz: 1024
batch: 10
device: 0
workers: 32
seed: 42
project: runs/native_x_trimodal
name: full2000_soft1024_cont
exist_ok: false
pretrained: true
optimizer: AdamW
lr0: 0.00008
lrf: 0.01
weight_decay: 0.0005
warmup_epochs: 1.0
cos_lr: true
close_mosaic: 0
mosaic: 0.3
mixup: 0.04
copy_paste: 0.03
scale: 0.35
translate: 0.05
fliplr: 0.5
flipud: 0.0
hsv_h: 0.004
hsv_s: 0.1
hsv_v: 0.1
multi_scale: false
patience: 0
save_period: 5
val: true
plots: true
amp: true
cache: ram
