# Debug 配置 — 用于快速验证 pipeline
# 使用方式: python train.py --config configs/debug.yaml

dataset:
  root: data/train
  num_classes: 12

input:
  width: 640
  height: 384

model:
  backbone: swin_tiny
  hidden_dim: 256
  queries: 300

train:
  epochs: 5
  batch_size: 2
  amp: true
  ema: false
  ema_decay: 0.0
  grad_clip: 0.1
  stages:
    - name: "debug"
      epochs: 5
      freeze: []
      lr: 0.0001

optimizer:
  name: AdamW
  lr: 0.0001
  backbone_lr: 0.00001
  weight_decay: 0.05

scheduler:
  type: cosine
  warmup_epochs: 1

loss:
  cost_class: 2.0
  cost_bbox: 5.0
  cost_giou: 2.0
  focal_alpha: 0.75
  focal_gamma: 2.0
  # 当前诊断中 GT 主要集中在 class 10/6/8，而预测塌到 0/2。
  # 先给少数/高频但未学到的类别更高权重，抑制 class 0 吸引子。
  class_weights: [0.5, 1.0, 0.7, 1.2, 1.2, 1.0, 2.0, 1.0, 2.0, 1.2, 2.5, 1.0]

cv:
  num_folds: 0
  split_dir: splits

checkpoint:
  save_dir: checkpoints/debug
  save_freq: 1

log:
  log_interval: 5
  tensorboard: false

device: cuda
seed: 42
num_workers: 2
