# YOLO11m full2000cont 1280 localization refinement.
#
# Keep the platform-best full2000cont model, data split, class prior, and model
# topology unchanged. Only raise input resolution and use a low-LR,
# weak-augmentation polishing stage so tiny objects retain more pixels.

model: runs/detect/runs/native_m_trimodal/full2000_soft1024_cont_noearly/weights/best.pt
data: data/yolo_full2000_soft/data.yaml
epochs: 36
imgsz: 1280
batch: 8
device: 0
workers: 12
seed: 42
project: runs/native_m_trimodal
name: full2000cont_1280_refine
exist_ok: false
pretrained: true
optimizer: AdamW
lr0: 0.00004
lrf: 0.05
weight_decay: 0.0005
warmup_epochs: 1.0
cos_lr: true
close_mosaic: 0
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0
scale: 0.15
translate: 0.03
fliplr: 0.5
flipud: 0.0
hsv_h: 0.002
hsv_s: 0.06
hsv_v: 0.06
multi_scale: false
patience: 999
save_period: 6
val: true
plots: true
amp: true
cache: ram
