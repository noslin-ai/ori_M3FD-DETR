# YOLO11m full2000_soft1024 CONTINUATION — no early stopping.
#
# First run (full2000_soft1024) early-stopped at ep28 because val peaked at ep3
# (0.692, basically inherited from the soft1024 init weight) then overfit-declined
# on the narrow 200-image val. That single run does not tell us whether the model
# can improve AFTER fully adapting to the larger training set.
#
# Continue from last.pt (ep28, fully adapted) with NO early stopping and a low LR
# so it gets room to keep adapting / finetuning on the full-2000 data without being
# cut off. patience=0 = run all epochs.

model: runs/detect/runs/native_m_trimodal/full2000_soft1024/weights/last.pt
data: data/yolo_full2000_soft/data.yaml
epochs: 40
imgsz: 1024
batch: 16
device: 0
workers: 16
seed: 42
project: runs/native_m_trimodal
name: full2000_soft1024_cont_noearly
exist_ok: false
pretrained: true
optimizer: AdamW
lr0: 0.00008
lrf: 0.01
weight_decay: 0.0005
warmup_epochs: 1.0
cos_lr: true
close_mosaic: 0
mosaic: 0.3
mixup: 0.04
copy_paste: 0.03
scale: 0.35
translate: 0.05
fliplr: 0.5
flipud: 0.0
hsv_h: 0.004
hsv_s: 0.1
hsv_v: 0.1
multi_scale: false
patience: 0
save_period: 5
val: true
plots: true
amp: true
cache: ram
