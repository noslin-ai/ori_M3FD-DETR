# YOLO11m soft-fusion CV validation run — fold K.
#
# Goal: find which validation fold reliably predicts the platform score. All prior
# models trained on fold1-train only, so only fold1_val was a clean holdout for them
# (but fold1's class mix is the most off-average: animal-heavy). Here we train with
# fold K held out as val (train on the other 4 folds = 1600) and see whether that
# fold's val score orders models like the platform does.
#
# NOTE on init: strict CV would start from pure yolo11m.pt (no data seen). We start
# from the platform-best soft768 weight for speed + inheritance; treat results as
# indicative of fold-discriminative power, not as production models.

model: runs/detect/runs/native_m_trimodal/soft768_labelrefresh_from_sar_best/weights/best.pt
data: data/soft_cv/2/data.yaml
epochs: 45
imgsz: 768
batch: 14
device: 0
workers: 14
seed: 42
project: runs/cv_folds
name: soft768_fold2
exist_ok: false
pretrained: true
optimizer: AdamW
lr0: 0.00016
lrf: 0.02
weight_decay: 0.0005
warmup_epochs: 2.0
cos_lr: true
close_mosaic: 10
mosaic: 0.6
mixup: 0.05
copy_paste: 0.04
scale: 0.4
translate: 0.07
fliplr: 0.5
flipud: 0.0
hsv_h: 0.005
hsv_s: 0.15
hsv_v: 0.14
multi_scale: false
patience: 18
save_period: 5
val: true
plots: true
amp: true
cache: ram
