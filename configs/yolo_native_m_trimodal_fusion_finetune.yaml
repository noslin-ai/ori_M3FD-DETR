# YOLO11m tri-modal fused fine-tune from the current platform-best branch.
#
# Paper-inspired ideas:
# - Dense small-object multi-modal detection: preserve modality-specific detail
#   for crowded/small objects instead of collapsing all cues into RGB color.
# - GLS-YOLOv8n RGB-depth-thermal fusion: use RGB texture, IR/thermal saliency
#   and depth structure as complementary channels.
# - DEYOLO cross-modality lesson: enhance each modality before fusion while
#   keeping a low-risk YOLO training/inference path.
#
# Prepare data:
#   python tools/prepare_yolo_trimodal_fused_data.py --fold 1 --overwrite
#
# Train:
#   yolo detect train cfg=configs/yolo_native_m_trimodal_fusion_finetune.yaml

model: runs/detect/runs/native_m_sar/rgb_sar768-2/weights/best.pt
data: data/yolo_trimodal_fusion_m/data.yaml
epochs: 80
imgsz: 768
batch: 8
device: 0
workers: 8
seed: 42
project: runs/native_m_trimodal
name: fusion768_from_sar_best
exist_ok: false
pretrained: true
optimizer: AdamW
lr0: 0.00025
lrf: 0.02
weight_decay: 0.0005
warmup_epochs: 2.0
cos_lr: true
close_mosaic: 10
mosaic: 0.8
mixup: 0.08
copy_paste: 0.05
scale: 0.5
translate: 0.08
fliplr: 0.5
flipud: 0.0
hsv_h: 0.0
hsv_s: 0.0
hsv_v: 0.08
multi_scale: false
patience: 25
save_period: 5
val: true
plots: true
amp: true
