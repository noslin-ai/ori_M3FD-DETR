# Finish the early-stopped tri-modal soft-fusion run.
#
# The v0.16.2 run stopped at 48/60 because patience=20. This short finish run
# starts from that run's last.pt and performs the remaining 12 low-lr epochs
# without early stopping. Mosaic/mixup/copy-paste are disabled to mimic the
# intended final close-mosaic polish phase rather than restarting augmentation.

model: runs/detect/runs/native_m_trimodal/soft768_from_sar_best/weights/last.pt
data: data/yolo_trimodal_soft_m/data.yaml
epochs: 12
imgsz: 768
batch: 8
device: 0
workers: 8
seed: 42
project: runs/native_m_trimodal
name: soft768_finish60_from_last
exist_ok: false
pretrained: true
optimizer: AdamW
lr0: 0.00003
lrf: 0.2
weight_decay: 0.0005
warmup_epochs: 0.5
cos_lr: true
close_mosaic: 0
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0
scale: 0.2
translate: 0.04
fliplr: 0.5
flipud: 0.0
hsv_h: 0.003
hsv_s: 0.08
hsv_v: 0.08
multi_scale: false
patience: 0
save_period: 4
val: true
plots: true
amp: true
