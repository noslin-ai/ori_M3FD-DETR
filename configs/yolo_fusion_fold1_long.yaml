# YOLO11m fold1 TRUE tri-modal continued (40 more epochs) from probe best.
#
# Probe (12ep, fusion_fold1_probe_from1280) reached local val mAP50-95=0.505
# monotonic. Continue from its best for 40 more epochs with a mild LR to see
# whether tri-modal local can break 0.6 on fold1 (1600/400) before committing
# to full-2000 retrain. Local-only decision probe (platform decides later).

model: runs/detect/runs/native_m_trimodal/fusion_fold1_probe_from1280/weights/best.pt
data: data/yolo_trimodal_fusion_fold1/data.yaml
epochs: 40
imgsz: 1024
batch: 16
device: 0
workers: 16
seed: 42
project: runs/native_m_trimodal
name: fusion_fold1_long_from_probe
exist_ok: false
pretrained: true
optimizer: AdamW
lr0: 0.00004
lrf: 0.05
weight_decay: 0.0005
warmup_epochs: 1.0
cos_lr: true
close_mosaic: 0
mosaic: 0.4
mixup: 0.04
copy_paste: 0.03
scale: 0.3
translate: 0.05
fliplr: 0.5
flipud: 0.0
hsv_h: 0.002
hsv_s: 0.05
hsv_v: 0.05
multi_scale: false
patience: 0
save_period: 5
val: true
plots: true
amp: true
cache: ram
