# YOLO11m FULL-2000 (all 2000 images) soft 1024 CONTINUATION — maximize data.
#
# Current best (m@conf0.65=56.727) trained on 1800 (full2000_soft1024_cont_noearly).
# This run uses ALL 2000 train images (no meaningful holdout; ~20 as tiny monitor
# val only for display, NOT for selection). More data (+11%) is the proven lever:
# fold1 1600 -> full 1800 gave +0.8~1.3. Push 1800 -> 2000 for another gain.
#
# Start from current best (platform 56.727). No early stop. Low LR continuation.
# Selection is by platform A/B of save_period checkpoints, NOT by local val
# (local val has proven negatively/unreliably correlated with platform).
#
# Data: data/yolo_full2000soft_all2000 (2000 train / ~20 monitor val, soft-fused)
#
# Run: yolo detect train cfg=configs/yolo_native_m_trimodal_full2000_all2000_soft1024.yaml

model: runs/detect/runs/native_m_trimodal/full2000_soft1024_cont_noearly/weights/best.pt
data: data/yolo_full2000soft_all2000/data.yaml
epochs: 90
imgsz: 1024
batch: 16
device: 0
workers: 16
seed: 42
project: runs/native_m_trimodal
name: full2000_all2000_soft1024
exist_ok: false
pretrained: true
optimizer: AdamW
lr0: 0.00008
lrf: 0.01
weight_decay: 0.0005
warmup_epochs: 1.0
cos_lr: true
close_mosaic: 0
mosaic: 0.3
mixup: 0.04
copy_paste: 0.03
scale: 0.35
translate: 0.05
fliplr: 0.5
flipud: 0.0
hsv_h: 0.004
hsv_s: 0.1
hsv_v: 0.1
multi_scale: false
patience: 0
save_period: 6
val: true
plots: true
amp: true
cache: ram
