# YOLO11m FULL-2000 + 1024 training.
#
# Rationale: all prior models trained only on fold1's 1600 images and selected on
# fold1's 400 (animal-heavy, misrepresents the platform test). Here we train on the
# FULL 2000 soft-fused images (12.5% more data) with a stratified ~200-image val
# whose class mix matches the full-2000 average (~ representative of typical data).
#
# Start from soft1024 best (ep27, fold1-clean mAP50-95=0.49589) to keep the proven
# 1024 small-object advantage; finetune on the larger, better-balanced training set.
#
# Data: data/yolo_full2000_soft  (1800 train / 200 val, soft-fused, labels refreshed)
#   find data/yolo_full2000_soft -name "*.cache" -delete

model: runs/detect/runs/native_m_trimodal/soft1024_from_soft768_best/weights/best.pt
data: data/yolo_full2000_soft/data.yaml
epochs: 60
imgsz: 1024
batch: 16
device: 0
workers: 16
seed: 42
project: runs/native_m_trimodal
name: full2000_soft1024
exist_ok: false
pretrained: true
optimizer: AdamW
lr0: 0.00015
lrf: 0.01
weight_decay: 0.0005
warmup_epochs: 2.0
cos_lr: true
close_mosaic: 10
mosaic: 0.6
mixup: 0.06
copy_paste: 0.05
scale: 0.5
translate: 0.08
fliplr: 0.5
flipud: 0.0
hsv_h: 0.006
hsv_s: 0.16
hsv_v: 0.15
multi_scale: false
patience: 25
save_period: 5
val: true
plots: true
amp: true
cache: ram
