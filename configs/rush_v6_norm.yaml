# Rush v6 norm -- restart with ImageNet-normalized RGB for the pretrained Swin.
#
# Recommended command:
#   python -u train.py --config configs/rush_v6_norm.yaml --fold 1 \
#     2>&1 | tee rush_v6_norm_train.log

dataset:
  root: data/train
  num_classes: 12

input:
  width: 800
  height: 512
  normalize_rgb: true

model:
  backbone: swin_tiny
  pretrained: true
  hidden_dim: 256
  queries: 300
  use_dn: false
  decoder_feature_level: -2

train:
  epochs: 180
  batch_size: 2
  amp: true
  ema: true
  ema_decay: 0.9999
  grad_clip: 0.1
  stages:
    - name: "norm_warmup"
      epochs: 30
      freeze: []
      lr: 0.0001
    - name: "norm_finetune"
      epochs: 180
      freeze: []
      lr: 0.00003

optimizer:
  name: AdamW
  lr: 0.0001
  backbone_lr: 0.00001
  weight_decay: 0.05

scheduler:
  type: warmup_cosine
  warmup_epochs: 3

loss:
  cost_class: 1.0
  cost_ce: 1.0
  cost_bbox: 8.0
  cost_giou: 4.0
  focal_alpha: 0.65
  focal_gamma: 2.0
  aux_loss_weight: 0.2
  quality_class_targets: true
  quality_floor: 0.1

cv:
  num_folds: 5
  split_dir: splits

checkpoint:
  save_dir: checkpoints/rush_v6_norm
  save_freq: 5
  best_metric: mAP50-95

log:
  log_interval: 50
  tensorboard: false

device: cuda
seed: 42
num_workers: 12
compile: false
