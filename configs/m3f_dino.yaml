# M3F-DINO 最终比赛配置
# 使用方式: python train.py --config configs/m3f_dino.yaml

# ---- 数据集 ----
dataset:
  root: data/train
  num_classes: 12

# ---- 输入 ----
input:
  width: 1280
  height: 768

# ---- 模型 ----
model:
  backbone: swin_large       # swin_tiny / swin_base / swin_large
  hidden_dim: 256
  queries: 900               # DINO queries 数量

# ---- 训练 ----
train:
  epochs: 300
  batch_size: 8              # RTX 5090 32G: 8, RTX 4090 24G: 4
  amp: true                  # 混合精度
  ema: true                  # EMA 模型平均
  ema_decay: 0.9999
  grad_clip: 0.1             # 梯度裁剪

  # 训练阶段
  stages:
    - name: "freeze_backbone"
      epochs: 50
      freeze: ["rgb_backbone"]
      lr: 1e-4
    - name: "full_train"
      epochs: 250
      freeze: []
      lr: 5e-5

# ---- 优化器 ----
optimizer:
  name: AdamW
  lr: 0.0001
  backbone_lr: 0.00001
  weight_decay: 0.05

# ---- 学习率调度 ----
scheduler:
  type: cosine               # cosine / warmup_cosine
  warmup_epochs: 5

# ---- 损失 ----
loss:
  cost_class: 2.0
  cost_bbox: 5.0
  cost_giou: 2.0
  focal_alpha: 0.25
  focal_gamma: 2.0

# ---- 5-Fold ----
cv:
  num_folds: 5
  split_dir: splits

# ---- Checkpoint ----
checkpoint:
  save_dir: checkpoints
  save_freq: 10

# ---- 日志 ----
log:
  log_interval: 50
  tensorboard: false

# ---- 硬件 ----
device: cuda
seed: 42
num_workers: 12             # 25 vCPU: 12 workers, persistent_workers=True (train.py)
